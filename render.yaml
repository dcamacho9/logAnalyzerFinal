services:
  - type: web
    name: log-analyzer-agent
    env: python
    plan: starter
    rootDir: log-analyzer-agent
    buildCommand: pip install -r requeriments.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT api:app
    healthCheckPath: /api/health
    envVars:
      - key: OLLAMA_API_URL
        sync: false
      - key: OLLAMA_MODEL
        value: phi:2.7b
      - key: OLLAMA_TIMEOUT
        value: 30
      - key: SERVICENOW_INSTANCE
        sync: false
      - key: SERVICENOW_CLIENT_ID
        sync: false
      - key: SERVICENOW_CLIENT_SECRET
        sync: false
      - key: SERVICENOW_CREATE_INCIDENTS
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: 1
